name: .NET Core CI

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # required for github-action-get-previous-tag

    - name: Get previous tag
      id: previoustag
      uses: 'WyriHaximus/github-action-get-previous-tag@v1'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Get next minor version
      id: semver
      uses: 'WyriHaximus/github-action-next-semvers@v1'
      with:
        version: ${{ steps.previoustag.outputs.tag }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ./Lunaris2.sln

    - name: Build
      run: dotnet build ./Lunaris2.sln --no-restore -c Release /p:AssemblyVersion=${{ steps.previoustag.outputs.tag }}

    - name: Test
      run: dotnet test ./Lunaris2.sln --no-build -c Release --verbosity normal

    - name: Publish
      run: dotnet publish ./Bot/Lunaris2.csproj --configuration Release --output ./out

    - name: Zip the build
      working-directory: ./out
      run: zip -r ../Lunaris_${{ steps.semver.outputs.patch }}.zip .

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.semver.outputs.patch }}
        name: Release ${{ steps.semver.outputs.patch }}
        files: ./Lunaris_${{ steps.semver.outputs.patch }}.zip
        fail_on_unmatched_files: true
        draft: false
        prerelease: false
